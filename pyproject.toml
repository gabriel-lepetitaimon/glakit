[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glakit"
version = "0.1.0"
description = "Personal Python utility toolkit"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gabriel Lepetit-Aimon" }]
keywords = ["utilities", "toolkit", "glakit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

dependencies = ["numpy>=1.25", "webcolors>=1.1.0"]

[dependency-groups]
dev = [
  'sphinx',           # Documentation generator
  'sphinx-rtd-theme', # Read the docs theme
  'pytest',           # To run tests
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = "--doctest-modules src/glakit --doctest-report ndiff -v"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
