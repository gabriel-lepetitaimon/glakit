[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glakit"
version = "0.1.0"
description = "Personal Python utility toolkit"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Gabriel Le Petit Aimon" }
]
keywords = ["utilities", "toolkit", "glakit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
